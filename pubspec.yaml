name: i_love_philosophy
description: "منصة المتفوّق الجزائري (Moutafawik DZ) لكافة الأطوار والمناهج التعليمية الجزائرية"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_pdfview: ^1.3.4
  font_awesome_flutter: ^10.8.0
  syncfusion_flutter_pdfviewer: ^28.1.33
  curved_navigation_bar: ^1.0.6
  animated_text_kit: ^4.2.2
  animations: ^2.0.6
  flutter_native_splash: ^2.2.17
  provider: ^6.1.2
  http: ^1.2.2
  google_sign_in: ^6.2.2
  firebase_auth: ^5.3.4
  firebase_core: ^3.8.1
  cloud_firestore: ^5.6.0
  flutter_local_notifications: ^18.0.1
  flutter_recaptcha_v2_compat: ^1.0.5
  logger: ^2.5.0
  shared_preferences: ^2.3.4
  flutter_launcher_icons: ^0.14.1
  sign_in_with_apple: ^6.1.3
  url_launcher: ^6.3.1
  flutter_colorpicker: ^1.1.0
  cached_network_image: ^3.4.1
  loading_animation_widget: ^1.3.0
  video_player: ^2.9.2
  flutter_cache_manager: ^3.4.1
 # facebook_auth: ^0.0.3
 # flutter_facebook_auth: ^7.1.1
  page_transition: ^2.1.0
  pdf: ^3.11.1
  google_fonts: ^6.2.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#1B0B3B"
  image: assets/images/app_logo_moutafawik.png
  android: true
  ios: true
  web: true

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

dependency_overrides:
  archive: ^4.7.1


